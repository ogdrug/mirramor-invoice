<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08130f">
  <title>Mirramor Mobile Invoice</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#07110d;
      --surface:#101d17;
      --surface-2:#16271f;
      --line:rgba(255,255,255,.09);
      --text:#f7fbf8;
      --muted:#9eb0a7;
      --green:#50dc90;
      --green-2:#a0f4c5;
      --gold:#eccb72;
      --danger:#ff7676;
      --shadow:0 18px 45px rgba(0,0,0,.32);
      --radius:20px;
      --safe-bottom:max(14px, env(safe-area-inset-bottom));
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      font-family:"Cairo",sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 5% 0%,rgba(80,220,144,.16),transparent 28%),
        radial-gradient(circle at 100% 12%,rgba(236,203,114,.09),transparent 25%),
        linear-gradient(180deg,#07110d,#091510 55%,#06100c);
      padding-bottom:120px;
    }

    button,input,textarea,select{font:inherit}
    button{cursor:pointer}
    input,textarea,select{
      width:100%;
      border:1px solid var(--line);
      background:rgba(255,255,255,.045);
      color:var(--text);
      border-radius:14px;
      padding:12px 13px;
      outline:none;
      transition:.2s ease;
    }

    input:focus,textarea:focus,select:focus{
      border-color:rgba(80,220,144,.6);
      box-shadow:0 0 0 4px rgba(80,220,144,.08);
    }

    input[type="number"]{direction:ltr;text-align:center}
    input[type="datetime-local"]{direction:ltr}
    textarea{min-height:78px;resize:vertical}

    .app{
      width:min(100%,760px);
      margin:auto;
      padding:12px;
    }

    .hero{
      position:sticky;
      top:0;
      z-index:30;
      margin:-12px -12px 12px;
      padding:10px 12px;
      backdrop-filter:blur(16px);
      background:rgba(7,17,13,.82);
      border-bottom:1px solid var(--line);
    }

    .hero-inner{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      max-width:760px;
      margin:auto;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .logo{
      width:44px;
      height:44px;
      flex:0 0 44px;
      border-radius:14px;
      display:grid;
      place-items:center;
      color:#062013;
      font-family:"Inter",sans-serif;
      font-weight:900;
      font-size:20px;
      background:linear-gradient(135deg,var(--green-2),var(--green));
      box-shadow:0 10px 30px rgba(80,220,144,.22);
    }

    .brand h1{
      margin:0;
      font-family:"Inter",sans-serif;
      font-size:18px;
      letter-spacing:.7px;
    }

    .brand p{
      margin:2px 0 0;
      color:var(--muted);
      font-size:10px;
    }

    .hero-actions{display:flex;gap:7px}

    .icon-btn{
      width:42px;
      height:42px;
      border-radius:13px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.045);
      color:var(--text);
      display:grid;
      place-items:center;
      font-size:18px;
    }

    .icon-btn:active{transform:scale(.96)}

    .card{
      background:linear-gradient(145deg,rgba(18,34,27,.96),rgba(10,23,17,.93));
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
      margin-bottom:12px;
    }

    .card-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:15px;
      border-bottom:1px solid var(--line);
      background:rgba(255,255,255,.018);
    }

    .card-title{
      margin:0;
      display:flex;
      align-items:center;
      gap:9px;
      font-size:15px;
      font-weight:800;
    }

    .badge{
      font-size:10px;
      color:var(--green-2);
      background:rgba(80,220,144,.1);
      border:1px solid rgba(80,220,144,.17);
      border-radius:999px;
      padding:6px 9px;
      white-space:nowrap;
    }

    .card-body{padding:15px}

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:11px;
    }

    .full{grid-column:1/-1}

    .field{
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    label{
      color:var(--muted);
      font-size:11px;
      font-weight:700;
    }

    .discount-strip{
      display:grid;
      grid-template-columns:1fr auto;
      gap:9px;
      align-items:end;
      padding:13px;
      border:1px solid rgba(80,220,144,.15);
      background:rgba(80,220,144,.055);
      border-radius:17px;
      margin-bottom:12px;
    }

    .btn{
      border:1px solid var(--line);
      color:var(--text);
      background:rgba(255,255,255,.045);
      border-radius:14px;
      min-height:45px;
      padding:10px 14px;
      font-weight:800;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:7px;
      transition:.18s ease;
    }

    .btn:active{transform:scale(.98)}

    .btn-primary{
      color:#06170e;
      border-color:transparent;
      background:linear-gradient(135deg,var(--green-2),var(--green));
    }

    .btn-gold{
      color:#241b06;
      border-color:transparent;
      background:linear-gradient(135deg,#ffeaa8,var(--gold));
    }

    .btn-danger{
      color:#ffdede;
      border-color:rgba(255,118,118,.2);
      background:rgba(255,118,118,.08);
    }

    .products{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .product{
      border:1px solid var(--line);
      background:rgba(255,255,255,.028);
      border-radius:18px;
      padding:13px;
    }

    .product-top{
      display:grid;
      grid-template-columns:1fr auto;
      gap:10px;
      align-items:center;
      margin-bottom:11px;
    }

    .product-name{
      font-weight:800;
      font-size:14px;
      min-width:0;
      background:transparent;
      border-color:transparent;
      padding:4px 0;
      text-align:right;
    }

    .product-name:focus{
      padding:8px 10px;
      border-color:rgba(80,220,144,.45);
    }

    .product-total{
      color:var(--green-2);
      font-family:"Inter",sans-serif;
      font-size:16px;
      font-weight:900;
      white-space:nowrap;
    }

    .product-controls{
      display:grid;
      grid-template-columns:1.12fr .88fr .88fr;
      gap:8px;
    }

    .mini-field{
      display:flex;
      flex-direction:column;
      gap:5px;
      min-width:0;
    }

    .mini-field label{
      font-size:9px;
      text-align:center;
    }

    .qty-box{
      display:grid;
      grid-template-columns:38px 1fr 38px;
      gap:5px;
      direction:ltr;
    }

    .qty-btn{
      border:1px solid var(--line);
      background:rgba(255,255,255,.05);
      color:var(--text);
      border-radius:11px;
      font-size:20px;
      line-height:1;
      min-height:42px;
    }

    .qty-btn:active{background:rgba(80,220,144,.13)}

    .product-actions{
      display:flex;
      gap:8px;
      margin-top:10px;
    }

    .product-actions .btn{
      min-height:39px;
      padding:8px 11px;
      font-size:11px;
      flex:1;
    }

    .summary{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .sum-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      color:var(--muted);
      font-size:13px;
    }

    .sum-row strong{
      color:var(--text);
      font-family:"Inter",sans-serif;
    }

    .sum-row.discount strong{color:#ffd17f}
    .sum-row.remaining strong{color:#ff9999}

    .divider{
      height:1px;
      background:var(--line);
      margin:3px 0;
    }

    .grand{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:14px;
      border-radius:16px;
      border:1px solid rgba(80,220,144,.22);
      background:linear-gradient(135deg,rgba(80,220,144,.14),rgba(80,220,144,.05));
    }

    .grand span{
      color:var(--green-2);
      font-weight:800;
    }

    .grand strong{
      font-family:"Inter",sans-serif;
      font-size:24px;
      color:#dcffea;
    }

    .sticky-total{
      position:fixed;
      z-index:50;
      left:0;
      right:0;
      bottom:0;
      padding:10px 12px var(--safe-bottom);
      background:rgba(7,17,13,.9);
      backdrop-filter:blur(18px);
      border-top:1px solid var(--line);
    }

    .sticky-inner{
      width:min(100%,760px);
      margin:auto;
      display:grid;
      grid-template-columns:1fr auto auto;
      gap:8px;
      align-items:center;
    }

    .sticky-price{
      min-width:0;
    }

    .sticky-price span{
      display:block;
      color:var(--muted);
      font-size:9px;
    }

    .sticky-price strong{
      display:block;
      color:var(--green-2);
      font-family:"Inter",sans-serif;
      font-size:20px;
      white-space:nowrap;
    }

    .sticky-total .btn{
      min-height:48px;
      padding:10px 13px;
      font-size:12px;
    }

    .saved-list{
      display:flex;
      flex-direction:column;
      gap:9px;
    }

    .saved-item{
      border:1px solid var(--line);
      background:rgba(255,255,255,.025);
      border-radius:15px;
      padding:12px;
    }

    .saved-top{
      display:flex;
      justify-content:space-between;
      gap:8px;
      margin-bottom:4px;
    }

    .saved-top strong{font-size:12px}
    .saved-total{
      color:var(--green-2);
      font-family:"Inter",sans-serif;
      font-weight:900;
    }

    .saved-meta{
      color:var(--muted);
      font-size:10px;
      display:flex;
      justify-content:space-between;
      gap:8px;
    }

    .saved-actions{
      display:flex;
      gap:7px;
      margin-top:9px;
    }

    .saved-actions .btn{
      flex:1;
      min-height:38px;
      padding:7px 10px;
      font-size:10px;
    }

    .toast{
      position:fixed;
      z-index:100;
      left:50%;
      bottom:92px;
      transform:translate(-50%,150%);
      width:min(calc(100% - 28px),420px);
      padding:12px 15px;
      border-radius:14px;
      border:1px solid rgba(80,220,144,.25);
      background:rgba(9,23,16,.96);
      color:var(--text);
      text-align:center;
      font-weight:700;
      box-shadow:var(--shadow);
      transition:.3s ease;
    }

    .toast.show{transform:translate(-50%,0)}

    .empty{
      text-align:center;
      color:var(--muted);
      padding:24px 10px;
      font-size:12px;
    }

    .section-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-top:12px;
    }

    @media (max-width:420px){
      .app{padding:9px}
      .hero{margin:-9px -9px 10px;padding:9px}
      .brand p{display:none}
      .grid{grid-template-columns:1fr}
      .full{grid-column:auto}
      .product-controls{grid-template-columns:1fr 1fr}
      .product-controls .qty-wrap{grid-column:1/-1}
      .sticky-inner{grid-template-columns:1fr 1fr}
      .sticky-price{grid-column:1/-1}
      .sticky-price strong{font-size:18px}
      .sticky-total .btn{width:100%}
    }

    @media print{
      @page{size:A4;margin:10mm}
      body{
        background:#fff!important;
        color:#111!important;
        padding:0;
      }
      .hero,.sticky-total,.no-print,.toast,.saved-card{display:none!important}
      .app{width:100%;padding:0}
      .card,.product{
        background:#fff!important;
        color:#111!important;
        border:1px solid #ddd!important;
        box-shadow:none!important;
      }
      .card{page-break-inside:avoid}
      .product{page-break-inside:avoid}
      input,textarea,select{
        background:transparent!important;
        color:#111!important;
        border:0!important;
        box-shadow:none!important;
        padding:2px!important;
      }
      label,.sum-row{color:#555!important}
      .product-total,.grand strong,.saved-total{color:#111!important}
      .grand{
        background:#f6f6f6!important;
        border-color:#ddd!important;
      }
      .grand span{color:#111!important}
      body::before{
        content:"MIRRAMOR";
        display:block;
        text-align:center;
        font-family:"Inter",sans-serif;
        font-weight:900;
        font-size:28px;
        margin-bottom:4px;
      }
    }
  </style>
</head>
<body>
  <div class="app">

    <header class="hero">
      <div class="hero-inner">
        <div class="brand">
          <div class="logo">M</div>
          <div>
            <h1>MIRRAMOR</h1>
            <p>فاتورة موبايل ذكية</p>
          </div>
        </div>

        <div class="hero-actions">
          <button class="icon-btn" id="newInvoiceBtn" title="فاتورة جديدة">＋</button>
          <button class="icon-btn" id="saveInvoiceBtn" title="حفظ">💾</button>
          <button class="icon-btn" id="printBtn" title="طباعة أو PDF">🖨️</button>
        </div>
      </div>
    </header>

    <section class="card">
      <div class="card-head">
        <h2 class="card-title">👤 بيانات العميل</h2>
        <span class="badge" id="statusBadge">فاتورة جديدة</span>
      </div>

      <div class="card-body">
        <div class="grid">
          <div class="field full">
            <label for="customerName">اسم العميل</label>
            <input id="customerName" type="text" placeholder="اكتب اسم العميل">
          </div>

          <div class="field">
            <label for="customerPhone">رقم الهاتف</label>
            <input id="customerPhone" type="tel" dir="ltr" placeholder="01xxxxxxxxx">
          </div>

          <div class="field">
            <label for="invoiceNo">رقم الفاتورة</label>
            <input id="invoiceNo" type="text" dir="ltr">
          </div>

          <div class="field full">
            <label for="invoiceDate">التاريخ والوقت</label>
            <input id="invoiceDate" type="datetime-local">
          </div>

          <div class="field">
            <label for="paymentMethod">طريقة الدفع</label>
            <select id="paymentMethod">
              <option>نقدي</option>
              <option>إنستاباي</option>
              <option>فودافون كاش</option>
              <option>تحويل بنكي</option>
              <option>آجل</option>
            </select>
          </div>

          <div class="field">
            <label for="salesperson">مسؤول البيع</label>
            <input id="salesperson" type="text" value="Dr. Omar">
          </div>

          <div class="field full">
            <label for="notes">ملاحظات</label>
            <textarea id="notes" placeholder="ملاحظات الطلب أو الشحن"></textarea>
          </div>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2 class="card-title">🧴 المنتجات</h2>
        <span class="badge" id="itemsBadge">0 قطعة</span>
      </div>

      <div class="card-body">
        <div class="discount-strip no-print">
          <div class="field">
            <label for="globalDiscount">خصم على كل المنتجات %</label>
            <input id="globalDiscount" type="number" min="0" max="100" step="0.1" value="0">
          </div>
          <button class="btn btn-primary" id="applyDiscountBtn">تطبيق</button>
        </div>

        <div id="products" class="products"></div>

        <div class="section-actions no-print">
          <button class="btn" id="addProductBtn">＋ إضافة منتج</button>
          <button class="btn btn-danger" id="clearQtyBtn">تفريغ الكميات</button>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2 class="card-title">🧾 ملخص الحساب</h2>
      </div>

      <div class="card-body">
        <div class="grid" style="margin-bottom:14px">
          <div class="field">
            <label for="shipping">الشحن</label>
            <input id="shipping" type="number" min="0" step="0.01" value="0">
          </div>

          <div class="field">
            <label for="paid">المدفوع</label>
            <input id="paid" type="number" min="0" step="0.01" value="0">
          </div>
        </div>

        <div class="summary">
          <div class="sum-row">
            <span>الإجمالي قبل الخصم</span>
            <strong id="subtotal">0.00 ج.م</strong>
          </div>

          <div class="sum-row discount">
            <span>الخصومات</span>
            <strong id="discountTotal">0.00 ج.م</strong>
          </div>

          <div class="sum-row">
            <span>الشحن</span>
            <strong id="shippingDisplay">0.00 ج.م</strong>
          </div>

          <div class="divider"></div>

          <div class="grand">
            <span>الإجمالي النهائي</span>
            <strong id="grandTotal">0.00 ج.م</strong>
          </div>

          <div class="divider"></div>

          <div class="sum-row">
            <span>المدفوع</span>
            <strong id="paidDisplay">0.00 ج.م</strong>
          </div>

          <div class="sum-row remaining">
            <span>المتبقي</span>
            <strong id="remaining">0.00 ج.م</strong>
          </div>
        </div>
      </div>
    </section>

    <section class="card saved-card">
      <div class="card-head">
        <h2 class="card-title">🗂️ الفواتير المحفوظة</h2>
        <button class="btn no-print" id="clearSavedBtn" style="min-height:36px;padding:7px 10px;font-size:10px">مسح الكل</button>
      </div>

      <div class="card-body">
        <div class="field no-print" style="margin-bottom:10px">
          <input id="searchSaved" type="search" placeholder="ابحث باسم العميل أو رقم الفاتورة">
        </div>
        <div id="savedList" class="saved-list"></div>
      </div>
    </section>

  </div>

  <div class="sticky-total">
    <div class="sticky-inner">
      <div class="sticky-price">
        <span>الإجمالي النهائي</span>
        <strong id="stickyGrand">0.00 ج.م</strong>
      </div>
      <button class="btn btn-gold" id="shareBtn">📲 مشاركة</button>
      <button class="btn btn-primary" id="whatsappBtn">واتساب</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    "use strict";

    const DEFAULT_PRODUCTS = [
      { name:"Face Serum", price:320, qty:0, discount:0, fixed:true },
      { name:"Facial Cleanser", price:180, qty:0, discount:0, fixed:true },
      { name:"Emollient", price:120, qty:0, discount:0, fixed:true },
      { name:"Sunscreen", price:230, qty:0, discount:0, fixed:true },
      { name:"Hair Serum", price:240, qty:0, discount:0, fixed:true },
      { name:"Massage Oil", price:50, qty:0, discount:0, fixed:true }
    ];

    let products = DEFAULT_PRODUCTS.map(p => ({...p}));
    let currentId = null;

    const $ = id => document.getElementById(id);
    const els = {
      customerName:$("customerName"),
      customerPhone:$("customerPhone"),
      invoiceNo:$("invoiceNo"),
      invoiceDate:$("invoiceDate"),
      paymentMethod:$("paymentMethod"),
      salesperson:$("salesperson"),
      notes:$("notes"),
      globalDiscount:$("globalDiscount"),
      shipping:$("shipping"),
      paid:$("paid"),
      products:$("products"),
      itemsBadge:$("itemsBadge"),
      subtotal:$("subtotal"),
      discountTotal:$("discountTotal"),
      shippingDisplay:$("shippingDisplay"),
      grandTotal:$("grandTotal"),
      stickyGrand:$("stickyGrand"),
      paidDisplay:$("paidDisplay"),
      remaining:$("remaining"),
      statusBadge:$("statusBadge"),
      searchSaved:$("searchSaved"),
      savedList:$("savedList"),
      toast:$("toast")
    };

    function n(v, fallback=0){
      const x = Number(v);
      return Number.isFinite(x) ? x : fallback;
    }

    function clamp(v,min,max){
      return Math.min(Math.max(v,min),max);
    }

    function money(v){
      return `${n(v).toLocaleString("ar-EG",{minimumFractionDigits:2,maximumFractionDigits:2})} ج.م`;
    }

    function esc(v){
      return String(v ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function nowInput(){
      const d = new Date();
      const local = new Date(d.getTime() - d.getTimezoneOffset()*60000);
      return local.toISOString().slice(0,16);
    }

    function invoiceNumber(){
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,"0");
      const day = String(d.getDate()).padStart(2,"0");
      return `MR-${y}${m}${day}-${String(Date.now()).slice(-5)}`;
    }

    function toast(msg){
      els.toast.textContent = msg;
      els.toast.classList.add("show");
      clearTimeout(toast.t);
      toast.t = setTimeout(() => els.toast.classList.remove("show"),2200);
    }

    function productMath(p){
      const price = Math.max(0,n(p.price));
      const qty = Math.max(0,Math.floor(n(p.qty)));
      const discount = clamp(n(p.discount),0,100);
      const gross = price*qty;
      const discountAmount = gross*discount/100;
      return {price,qty,discount,gross,discountAmount,total:gross-discountAmount};
    }

    function renderProducts(){
      els.products.innerHTML = "";

      products.forEach((p,index) => {
        const m = productMath(p);
        const card = document.createElement("article");
        card.className = "product";
        card.dataset.index = index;

        card.innerHTML = `
          <div class="product-top">
            <input class="product-name" data-field="name" data-index="${index}" value="${esc(p.name)}" aria-label="اسم المنتج">
            <div class="product-total" id="rowTotal-${index}">${money(m.total)}</div>
          </div>

          <div class="product-controls">
            <div class="mini-field qty-wrap">
              <label>الكمية</label>
              <div class="qty-box">
                <button class="qty-btn no-print" data-action="minus" data-index="${index}" type="button">−</button>
                <input data-field="qty" data-index="${index}" type="number" min="0" step="1" value="${m.qty}">
                <button class="qty-btn no-print" data-action="plus" data-index="${index}" type="button">＋</button>
              </div>
            </div>

            <div class="mini-field">
              <label>السعر</label>
              <input data-field="price" data-index="${index}" type="number" min="0" step="0.01" value="${m.price}">
            </div>

            <div class="mini-field">
              <label>الخصم %</label>
              <input data-field="discount" data-index="${index}" type="number" min="0" max="100" step="0.1" value="${m.discount}">
            </div>
          </div>

          <div class="product-actions no-print">
            <button class="btn" data-action="clear" data-index="${index}">تصفير المنتج</button>
            ${p.fixed ? "" : `<button class="btn btn-danger" data-action="delete" data-index="${index}">حذف المنتج</button>`}
          </div>
        `;

        els.products.appendChild(card);
      });

      calculate();
    }

    function updateProductCard(index){
      const card = els.products.querySelector(`.product[data-index="${index}"]`);
      if (!card || !products[index]) return;
      const m = productMath(products[index]);
      const total = card.querySelector(`#rowTotal-${index}`);
      if (total) total.textContent = money(m.total);
      calculate();
    }

    function calculate(){
      let subtotal = 0;
      let discounts = 0;
      let pieces = 0;

      products.forEach(p => {
        const m = productMath(p);
        subtotal += m.gross;
        discounts += m.discountAmount;
        pieces += m.qty;
      });

      const shipping = Math.max(0,n(els.shipping.value));
      const paid = Math.max(0,n(els.paid.value));
      const grand = Math.max(0,subtotal-discounts+shipping);
      const remaining = Math.max(0,grand-paid);

      els.subtotal.textContent = money(subtotal);
      els.discountTotal.textContent = money(discounts);
      els.shippingDisplay.textContent = money(shipping);
      els.grandTotal.textContent = money(grand);
      els.stickyGrand.textContent = money(grand);
      els.paidDisplay.textContent = money(paid);
      els.remaining.textContent = money(remaining);
      els.itemsBadge.textContent = `${pieces.toLocaleString("ar-EG")} قطعة`;

      return {subtotal,discounts,shipping,paid,grand,remaining,pieces};
    }

    function collect(){
      return {
        id:currentId || crypto.randomUUID(),
        customerName:els.customerName.value.trim(),
        customerPhone:els.customerPhone.value.trim(),
        invoiceNo:els.invoiceNo.value.trim(),
        invoiceDate:els.invoiceDate.value,
        paymentMethod:els.paymentMethod.value,
        salesperson:els.salesperson.value.trim(),
        notes:els.notes.value.trim(),
        globalDiscount:n(els.globalDiscount.value),
        shipping:n(els.shipping.value),
        paid:n(els.paid.value),
        products:products.map(p => ({...p})),
        totals:calculate(),
        savedAt:new Date().toISOString()
      };
    }

    function saved(){
      try{
        return JSON.parse(localStorage.getItem("mirramor_mobile_invoices_v1") || "[]");
      }catch{
        return [];
      }
    }

    function setSaved(list){
      localStorage.setItem("mirramor_mobile_invoices_v1",JSON.stringify(list));
    }

    function saveInvoice(){
      const inv = collect();
      if(!inv.customerName){
        toast("اكتب اسم العميل أولًا");
        els.customerName.focus();
        return;
      }

      const list = saved();
      const i = list.findIndex(x => x.id === inv.id);
      if(i >= 0) list[i] = inv;
      else list.unshift(inv);

      setSaved(list.slice(0,200));
      currentId = inv.id;
      els.statusBadge.textContent = "تم الحفظ";
      renderSaved();
      toast("تم حفظ الفاتورة");
    }

    function loadInvoice(id){
      const inv = saved().find(x => x.id === id);
      if(!inv) return;

      currentId = inv.id;
      els.customerName.value = inv.customerName || "";
      els.customerPhone.value = inv.customerPhone || "";
      els.invoiceNo.value = inv.invoiceNo || invoiceNumber();
      els.invoiceDate.value = inv.invoiceDate || nowInput();
      els.paymentMethod.value = inv.paymentMethod || "نقدي";
      els.salesperson.value = inv.salesperson || "Dr. Omar";
      els.notes.value = inv.notes || "";
      els.globalDiscount.value = n(inv.globalDiscount);
      els.shipping.value = n(inv.shipping);
      els.paid.value = n(inv.paid);
      products = (inv.products || []).map((p,index) => ({
        ...p,
        fixed:typeof p.fixed === "boolean" ? p.fixed : index < DEFAULT_PRODUCTS.length
      }));

      els.statusBadge.textContent = "فاتورة محفوظة";
      renderProducts();
      window.scrollTo({top:0,behavior:"smooth"});
      toast("تم فتح الفاتورة");
    }

    function deleteSaved(id){
      setSaved(saved().filter(x => x.id !== id));
      if(currentId === id){
        currentId = null;
        els.statusBadge.textContent = "فاتورة جديدة";
      }
      renderSaved();
      toast("تم حذف الفاتورة");
    }

    function renderSaved(){
      const q = els.searchSaved.value.trim().toLowerCase();
      const list = saved().filter(inv => {
        if(!q) return true;
        return [inv.customerName,inv.customerPhone,inv.invoiceNo]
          .join(" ").toLowerCase().includes(q);
      });

      els.savedList.innerHTML = "";

      if(!list.length){
        els.savedList.innerHTML = `<div class="empty">لا توجد فواتير محفوظة</div>`;
        return;
      }

      list.forEach(inv => {
        const item = document.createElement("div");
        item.className = "saved-item";
        const date = inv.invoiceDate
          ? new Date(inv.invoiceDate).toLocaleString("ar-EG",{dateStyle:"medium",timeStyle:"short"})
          : "";

        item.innerHTML = `
          <div class="saved-top">
            <strong>${esc(inv.customerName || "بدون اسم")}</strong>
            <span class="saved-total">${money(inv.totals?.grand || 0)}</span>
          </div>
          <div class="saved-meta">
            <span>${esc(inv.invoiceNo || "")}</span>
            <span>${date}</span>
          </div>
          <div class="saved-actions">
            <button class="btn" data-saved="load" data-id="${inv.id}">فتح</button>
            <button class="btn btn-danger" data-saved="delete" data-id="${inv.id}">حذف</button>
          </div>
        `;

        els.savedList.appendChild(item);
      });
    }

    function newInvoice(){
      currentId = null;
      products = DEFAULT_PRODUCTS.map(p => ({...p}));
      els.customerName.value = "";
      els.customerPhone.value = "";
      els.invoiceNo.value = invoiceNumber();
      els.invoiceDate.value = nowInput();
      els.paymentMethod.value = "نقدي";
      els.salesperson.value = "Dr. Omar";
      els.notes.value = "";
      els.globalDiscount.value = 0;
      els.shipping.value = 0;
      els.paid.value = 0;
      els.statusBadge.textContent = "فاتورة جديدة";
      renderProducts();
      els.customerName.focus();
      toast("تم إنشاء فاتورة جديدة");
    }

    function invoiceText(){
      const inv = collect();
      const rows = inv.products
        .map(p => {
          const m = productMath(p);
          if(m.qty <= 0) return null;
          const d = m.discount > 0 ? ` — خصم ${m.discount}%` : "";
          return `• ${p.name} × ${m.qty} = ${money(m.total)}${d}`;
        })
        .filter(Boolean);

      return [
        "MIRRAMOR",
        "فاتورة مبيعات",
        "━━━━━━━━━━━━━━",
        `رقم الفاتورة: ${inv.invoiceNo}`,
        `العميل: ${inv.customerName || "غير مسجل"}`,
        inv.customerPhone ? `الهاتف: ${inv.customerPhone}` : null,
        `التاريخ: ${inv.invoiceDate ? new Date(inv.invoiceDate).toLocaleString("ar-EG") : ""}`,
        `الدفع: ${inv.paymentMethod}`,
        "━━━━━━━━━━━━━━",
        ...rows,
        "━━━━━━━━━━━━━━",
        `قبل الخصم: ${money(inv.totals.subtotal)}`,
        `الخصومات: ${money(inv.totals.discounts)}`,
        `الشحن: ${money(inv.totals.shipping)}`,
        `الإجمالي: ${money(inv.totals.grand)}`,
        `المدفوع: ${money(inv.totals.paid)}`,
        `المتبقي: ${money(inv.totals.remaining)}`,
        inv.notes ? `ملاحظات: ${inv.notes}` : null,
        "━━━━━━━━━━━━━━",
        "شكرًا لاختيارك Mirramor 🤍"
      ].filter(Boolean).join("\n");
    }

    async function shareInvoice(){
      const text = invoiceText();

      if(navigator.share){
        try{
          await navigator.share({
            title:`فاتورة Mirramor - ${els.customerName.value || ""}`,
            text
          });
          return;
        }catch(err){
          if(err?.name === "AbortError") return;
        }
      }

      try{
        await navigator.clipboard.writeText(text);
        toast("تم نسخ الفاتورة للمشاركة");
      }catch{
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
        toast("تم نسخ الفاتورة للمشاركة");
      }
    }

    function openWhatsApp(){
      const phone = els.customerPhone.value.replace(/\D/g,"");
      const normalized = phone.startsWith("0") ? `20${phone.slice(1)}` : phone;
      const text = encodeURIComponent(invoiceText());
      const url = normalized
        ? `https://wa.me/${normalized}?text=${text}`
        : `https://wa.me/?text=${text}`;
      window.open(url,"_blank","noopener");
    }

    els.products.addEventListener("input",e => {
      const input = e.target.closest("[data-field][data-index]");
      if(!input) return;

      const index = n(input.dataset.index);
      const field = input.dataset.field;
      if(!products[index]) return;

      if(field === "name") products[index].name = input.value;
      if(field === "qty") products[index].qty = Math.max(0,Math.floor(n(input.value)));
      if(field === "price") products[index].price = Math.max(0,n(input.value));
      if(field === "discount") products[index].discount = clamp(n(input.value),0,100);

      updateProductCard(index);
    });

    els.products.addEventListener("click",e => {
      const btn = e.target.closest("[data-action][data-index]");
      if(!btn) return;

      const index = n(btn.dataset.index);
      const action = btn.dataset.action;
      if(!products[index]) return;

      if(action === "plus") products[index].qty = productMath(products[index]).qty + 1;
      if(action === "minus") products[index].qty = Math.max(0,productMath(products[index]).qty - 1);
      if(action === "clear") products[index].qty = 0;
      if(action === "delete") products.splice(index,1);

      renderProducts();
    });

    els.savedList.addEventListener("click",e => {
      const btn = e.target.closest("[data-saved][data-id]");
      if(!btn) return;
      if(btn.dataset.saved === "load") loadInvoice(btn.dataset.id);
      if(btn.dataset.saved === "delete" && confirm("حذف الفاتورة؟")) deleteSaved(btn.dataset.id);
    });

    $("applyDiscountBtn").addEventListener("click",() => {
      const d = clamp(n(els.globalDiscount.value),0,100);
      els.globalDiscount.value = d;
      products = products.map(p => ({...p,discount:d}));
      renderProducts();
      toast(`تم تطبيق خصم ${d}% على الكل`);
    });

    $("addProductBtn").addEventListener("click",() => {
      products.push({
        name:"منتج جديد",
        price:0,
        qty:1,
        discount:clamp(n(els.globalDiscount.value),0,100),
        fixed:false
      });
      renderProducts();
      const last = els.products.querySelector(`[data-field="name"][data-index="${products.length-1}"]`);
      if(last){last.focus();last.select();}
    });

    $("clearQtyBtn").addEventListener("click",() => {
      products = products.map(p => ({...p,qty:0}));
      renderProducts();
      toast("تم تفريغ الكميات مع بقاء أسماء المنتجات");
    });

    $("newInvoiceBtn").addEventListener("click",newInvoice);
    $("saveInvoiceBtn").addEventListener("click",saveInvoice);
    $("printBtn").addEventListener("click",() => window.print());
    $("shareBtn").addEventListener("click",shareInvoice);
    $("whatsappBtn").addEventListener("click",openWhatsApp);

    $("clearSavedBtn").addEventListener("click",() => {
      if(!saved().length){toast("لا توجد فواتير محفوظة");return;}
      if(confirm("مسح جميع الفواتير المحفوظة؟")){
        localStorage.removeItem("mirramor_mobile_invoices_v1");
        currentId = null;
        els.statusBadge.textContent = "فاتورة جديدة";
        renderSaved();
        toast("تم مسح الفواتير");
      }
    });

    els.shipping.addEventListener("input",calculate);
    els.paid.addEventListener("input",calculate);
    els.searchSaved.addEventListener("input",renderSaved);

    els.invoiceNo.value = invoiceNumber();
    els.invoiceDate.value = nowInput();
    renderProducts();
    renderSaved();
  </script>
</body>
</html>
